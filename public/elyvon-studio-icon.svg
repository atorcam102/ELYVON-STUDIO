<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2029"/>
      <stop offset="1" stop-color="#0D0E12"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FE3D0"/>
      <stop offset="0.55" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#9B7BE8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- The "E" is drawn as three level bars on a spine: a nod to meters and faders. -->
  <g fill="url(#mark)">
    <rect x="300" y="280" width="92" height="464" rx="46"/>
    <rect x="300" y="280" width="436" height="92" rx="46"/>
    <rect x="300" y="466" width="336" height="92" rx="46"/>
    <rect x="300" y="652" width="436" height="92" rx="46"/>
  </g>
  <circle cx="676" cy="512" r="28" fill="#7FE3D0" opacity="0.9"/>
</svg>
