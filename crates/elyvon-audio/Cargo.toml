[package]
name = "elyvon-audio"
description = "Elyvon Studio audio engine: tempo-mapped transport, block scheduler, media decoding, mixing and offline render."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
elyvon-core.workspace = true
elyvon-project.workspace = true
cpal = { version = "0.18.2", optional = true }
rtrb = "0.4.0"
midly = { version="0.5.3", default-features=false, features=["std"] }
midir = { version="0.11.1", optional=true }
rubato = "5.0.1"
# Partitioned FFT convolution (already in the tree through rubato).
realfft = "3.5.0"
serde.workspace = true
serde_json.workspace = true
# MP3 tags (including embedded artwork) precede the audio frames. Without
# ID3 readers, probing scans the tags as audio and fails once they exceed 1 MiB.
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "pcm", "flac", "mp3", "ogg", "vorbis", "id3v1", "id3v2"] }
ts-rs.workspace = true
tempfile.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# Real audio-device output (cpal). Off for headless engine/render tests.
device = ["dep:cpal", "dep:midir"]
