name: Publish Windows preview

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful main CI run to publish
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-windows-preview-0.2.0-1
  cancel-in-progress: false

env:
  APP_VERSION: "0.2.0"
  RELEASE_TAG: "v0.2.0-windows-preview.1"
  SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  publish:
    name: Publish verified Windows x64 and x86 installers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Verify successful main CI provenance
        id: source
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['conclusion'] == 'success', 'Source CI did not succeed'
          assert run['head_branch'] == 'main', 'Source must be main'
          assert run['repository']['full_name'] == os.environ['GH_REPO'], 'Unexpected repository'
          assert run['path'] == '.github/workflows/ci.yml', 'Unexpected source workflow'
          jobs = json.load(open('source-jobs.json'))['jobs']
          for name in ['Frontend (typecheck, lint, test, build)', 'Rust (fmt, clippy, test, bindings)',
                       'End-to-end (Linux, real binary)', 'Dependencies, licences and workflow syntax',
                       'Build windows-x64', 'Build windows-x86']:
              matches = [j for j in jobs if j['name'] == name]
              assert len(matches) == 1 and matches[0]['conclusion'] == 'success', f'{name} did not succeed'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"commit={run['head_sha']}\n")
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.commit }}
      - name: Publish only the immutable release tag's exact build
        id: release
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          tag_commit=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'This CI run is not the tagged release commit; no release changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/check-versions.mjs "v$APP_VERSION"
          node scripts/release-notes.mjs "$APP_VERSION" --notes-only > /dev/null
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Download verified Windows x64 installers
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-windows-x64
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: release
      - name: Download verified Windows x86 installers
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-windows-x86
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: release
      - name: Validate installer set and generate checksums
        if: steps.release.outputs.publish == 'true'
        working-directory: release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          version = os.environ['APP_VERSION']
          expected = {f'Elyvon-Studio-v{version}-windows-{arch}{suffix}'
                      for arch in ['x64', 'x86'] for suffix in ['-setup.exe', '.msi']}
          actual = {p.name for p in Path('.').iterdir() if p.is_file()}
          assert actual == expected, f'Unexpected installer set: {actual}'
          lines = []
          for name in sorted(expected):
              data = Path(name).read_bytes()
              assert len(data) > 100000, f'Installer unexpectedly small: {name}'
              magic = b'MZ' if name.endswith('.exe') else bytes.fromhex('d0cf11e0a1b11ae1')
              assert data.startswith(magic), f'Invalid installer: {name}'
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {name}\n')
          Path('SHA256SUMS.txt').write_text(''.join(lines))
          PY
          sha256sum --check SHA256SUMS.txt
      - name: Create release draft and attach missing files
        if: steps.release.outputs.publish == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          node scripts/release-notes.mjs "$APP_VERSION" --notes-only > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Windows downloads

          For most Windows 10/11 computers, choose **Elyvon-Studio-v0.2.0-windows-x64-setup.exe**.
          Windows x86/32-bit has its own EXE. MSI packages are alternatives for managed installation;
          install only one package for your architecture. SHA256SUMS.txt covers all four files.

          This is an unsigned development preview. It has no Authenticode/updater signatures or
          latest.json; install future versions manually. Physical audio/MIDI device testing,
          multi-device clock drift, live input SRC and hosted plug-in compensation remain pending.
          No internal instrument or MIDI 2.0/UMP is included. macOS/Linux installers are not part
          of this release. Software tests and successful builds do not certify physical devices.
          NOTES
          printf '\nSource: `%s`. [Successful CI run](https://github.com/%s/actions/runs/%s).\n' \
            "$SOURCE_COMMIT" "$GH_REPO" "$SOURCE_RUN" >> release-notes.md
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
              --title "Elyvon Studio $APP_VERSION — Windows audio and MIDI preview" \
              --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isPrerelease > attached-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.load(open('attached-assets.json'))
          assert release['isPrerelease'], 'Refusing to change a stable release'
          existing = {a['name'] for a in release['assets']}
          files = sorted(p for p in Path('release').iterdir() if p.is_file())
          assert existing <= {p.name for p in files}, 'Unexpected existing asset'
          Path('missing-assets.txt').write_text(''.join(f'{p}\n' for p in files if p.name not in existing))
          PY
          while IFS= read -r file; do
            gh release upload "$RELEASE_TAG" "$file"
          done < missing-assets.txt
      - name: Verify downloaded assets and publish
        if: steps.release.outputs.publish == 'true'
        run: |
          gh release view "$RELEASE_TAG" --json assets > published-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {p.name: p.stat().st_size for p in Path('release').iterdir() if p.is_file()}
          actual = {a['name']: a['size'] for a in json.load(open('published-assets.json'))['assets']}
          assert actual == expected, f'Asset set differs: {actual}'
          PY
          gh release download "$RELEASE_TAG" --dir verify-download
          cmp release/SHA256SUMS.txt verify-download/SHA256SUMS.txt
          (cd verify-download && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets > final-release.json
          python3 - <<'PY'
          import json, os
          release = json.load(open('final-release.json'))
          assert not release['isDraft'] and release['isPrerelease']
          assert len(release['assets']) == 5
          print(release['url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Published [{os.environ['RELEASE_TAG']}]({release['url']}) with four verified Windows installers and checksums.\n")
          PY
