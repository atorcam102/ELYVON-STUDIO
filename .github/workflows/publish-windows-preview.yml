name: Publish Windows preview

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-windows-preview.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-windows-preview-3
  cancel-in-progress: false

env:
  SOURCE_RUN: "38768320136"
  SOURCE_COMMIT: "974b09c015009d254be135629b3658fe638c7115"
  RELEASE_TAG: "v0.1.0-windows-preview.3"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  publish:
    name: Publish existing Windows x64 and x86 installers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify build provenance and Windows job results
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['head_sha'] == os.environ['SOURCE_COMMIT'], 'Unexpected source commit'
          assert run['conclusion'] == 'success', 'Source CI did not complete successfully'
          assert run['repository']['full_name'] == os.environ['GH_REPO'], 'Unexpected repository'
          assert run['path'] == '.github/workflows/ci.yml', 'Unexpected source workflow'
          jobs = json.load(open('source-jobs.json'))['jobs']
          for name in ['Build windows-x64', 'Build windows-x86']:
              matches = [job for job in jobs if job['name'] == name]
              assert len(matches) == 1 and matches[0]['conclusion'] == 'success', f'{name} did not succeed'
          PY
      - name: Download existing Windows x64 installers
        uses: actions/download-artifact@v4
        with:
          name: ci-windows-x64
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: release
      - name: Download existing Windows x86 installers
        uses: actions/download-artifact@v4
        with:
          name: ci-windows-x86
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: release
      - name: Validate installers and generate checksums
        working-directory: release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {f'Elyvon-Studio-v0.1.0-windows-{arch}{suffix}' for arch in ['x64', 'x86'] for suffix in ['-setup.exe', '.msi']}
          actual = {p.name for p in Path('.').iterdir() if p.is_file()}
          assert actual == expected, f'Unexpected installer set: {actual}'
          lines = []
          for name in sorted(expected):
              data = Path(name).read_bytes()
              assert len(data) > 100000, f'Installer is unexpectedly small: {name}'
              if name.endswith('.exe'):
                  assert data[:2] == b'MZ', f'Invalid Windows executable: {name}'
              else:
                  assert data[:8] == bytes.fromhex('d0cf11e0a1b11ae1'), f'Invalid MSI container: {name}'
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {name}\n')
          Path('SHA256SUMS.txt').write_text(''.join(lines))
          PY
          sha256sum --check SHA256SUMS.txt
      - name: Publish Windows preview release
        run: |
          cat > release-notes.md <<'NOTES'
          ## Elyvon Studio 0.1.0 — Windows preview 3

          This release includes the redesigned native studio interface and the Phase 02 technical baseline from `main`:

          - Track and region arrangement, project save/open, undo/redo and recovery.
          - Graphite workspace, compact LCD transport, left-side library, inspector, mixer and read-only piano roll.
          - Versioned native IPC, MIDI, graph and job contracts, compatibility fixtures and native restart tests.
          - Updated documentation, support matrix and reproducible dependency and performance evidence.

          ### Which installer should I download?

          For most users with **64-bit Windows**, choose **Elyvon-Studio-v0.1.0-windows-x64-setup.exe**.

          | Windows architecture | Standard installer (recommended) | Windows Installer package |
          | --- | --- | --- |
          | x64 / 64-bit | `Elyvon-Studio-v0.1.0-windows-x64-setup.exe` | `Elyvon-Studio-v0.1.0-windows-x64.msi` |
          | x86 / 32-bit | `Elyvon-Studio-v0.1.0-windows-x86-setup.exe` | `Elyvon-Studio-v0.1.0-windows-x86.msi` |

          Download and install **one** package for your architecture. EXE (NSIS) and MSI (Windows Installer) contain the same application and features; MSI is useful for managed or automated deployments. `SHA256SUMS.txt` contains checksums for all four installers.

          **Build source:** commit `974b09c015009d254be135629b3658fe638c7115`, [successful CI run 38768320136](https://github.com/atorcam102/ELYVON-STUDIO/actions/runs/38768320136). All six CI jobs passed, including separate Windows x64/x86 installer builds and native Linux GUI tests.

          The existing verified CI installers are published without rebuilding. The application version remains 0.1.0. Earlier releases are preserved.

          ### Current limitations

          This is a development preview. Audio playback, recording, instruments and plug-in processing are not implemented. MIDI, graph and job contracts do not implement an engine, device backend or scheduler. Demo waveforms are labelled illustrations and the piano roll is read-only.

          Installers are unsigned (no Authenticode or updater signatures). This release does not include `latest.json` or enable automatic updates. Physical Windows installation and device tests remain pending; CI builds do not replace them.

          NOTES
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'The existing release entry is preserved.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Elyvon Studio 0.1.0 — Windows x64 / x86 preview 3" \
              --notes-file release-notes.md
          fi
      - name: Attach missing installers and checksums
        run: |
          gh release view "$RELEASE_TAG" --json assets > attached-assets.json
          python3 - <<'PYUPLOAD'
          import json
          from pathlib import Path
          existing = {asset['name'] for asset in json.load(open('attached-assets.json'))['assets']}
          files = sorted(p for p in Path('release').iterdir() if p.is_file())
          assert existing <= {p.name for p in files}, 'Unexpected existing release asset'
          Path('missing-assets.txt').write_text(''.join(f'{p}\n' for p in files if p.name not in existing))
          PYUPLOAD
          while IFS= read -r file; do
            gh release upload "$RELEASE_TAG" "$file"
          done < missing-assets.txt
      - name: Verify attached files match the source installers
        run: |
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets > published-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.load(open('published-release.json'))
          assert release['isPrerelease']
          expected = {p.name: p.stat().st_size for p in Path('release').iterdir() if p.is_file()}
          actual = {asset['name']: asset['size'] for asset in release['assets']}
          assert actual == expected, f'Published assets differ: {actual}'
          print(release['url'])
          PY
          gh release download "$RELEASE_TAG" --dir verify-download
          cmp release/SHA256SUMS.txt verify-download/SHA256SUMS.txt
          cd verify-download
          sha256sum --check SHA256SUMS.txt
      - name: Publish the verified GitHub release
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url,isDraft,assets > final-release.json
          python3 - <<'PYPUBLISH'
          import json
          release = json.load(open('final-release.json'))
          assert not release['isDraft'], 'Release was not published'
          assert len(release['assets']) == 5, 'Missing release attachments'
          print(release['url'])
          PYPUBLISH
          echo "Published $RELEASE_TAG from $SOURCE_COMMIT with four Windows installers and SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
