name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Frontend checks (same command as local development)
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3

  rust:
    name: Rust (fmt, clippy, test, bindings)
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust checks and binding drift (same command as local development)
        run: npm run check:rust

  e2e:
    name: End-to-end (Linux, real binary)
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: System libraries and WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libasound2-dev webkit2gtk-driver xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Build the application (debug, no installers)
        run: npx tauri build --debug --no-bundle
      - name: Run end-to-end tests
        env:
          E2E_SCREENSHOTS: e2e-screenshots
        run: xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- node --test e2e/app.e2e.mjs
      - name: Measure real native startup, idle RSS and timeline
        env:
          E2E_METRICS: e2e-evidence/native-metrics.json
        run: xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- node e2e/measure.mjs
      - name: Audio device inventory and headless engine run (no sound card on the runner)
        run: |
          mkdir -p e2e-evidence
          cargo run --locked -p elyvon-audio-device --example audio-probe -- --list | tee e2e-evidence/audio-devices.txt
          cargo run --locked -p elyvon-audio-device --example audio-probe -- \
            --host headless --device headless:clock --rate 48000 --buffer 256 --seconds 5 \
            --json e2e-evidence/audio-headless.json | tee e2e-evidence/audio-headless.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence
          path: |
            e2e-screenshots
            e2e-evidence
          retention-days: 30
          if-no-files-found: error

  msrv:
    name: Minimum Rust version (1.90)
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Workspace builds with the declared rust-version
        run: cargo check --workspace --all-targets --locked

  audio-targets:
    name: Audio engine type-check (Windows ARM64, macOS x64/ARM64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: audio-targets
      # Type-checks the WASAPI/CoreAudio code paths without linking or running.
      # This is compile evidence only, not platform support.
      - name: cargo check per target
        run: |
          for target in aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin; do
            cargo check --locked --target "$target" -p elyvon-audio -p elyvon-audio-device --all-targets
          done

  audio-macos:
    name: Audio engine tests (macOS Apple Silicon, CoreAudio)
    # macOS minutes are expensive: run on PRs, main and manual dispatch only.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: audio-macos
      - name: Engine core and device layer tests (headless + CoreAudio enumeration)
        run: cargo test --locked -p elyvon-audio -p elyvon-audio-device
      - name: Device inventory on the runner
        run: |
          mkdir -p audio-evidence
          cargo run --locked -p elyvon-audio-device --example audio-probe -- --list | tee audio-evidence/macos-audio-devices.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-evidence-macos
          path: audio-evidence
          retention-days: 30
          if-no-files-found: warn

  dependencies:
    name: Dependencies, licences and workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install checksum-verified audit tools
        shell: bash
        run: |
          mkdir -p audit-evidence
          bash scripts/install-audit-tools.sh "$RUNNER_TEMP/elyvon-audit-tools" 2>&1 | tee audit-evidence/tool-install.txt
          echo "$RUNNER_TEMP/elyvon-audit-tools" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Dependency and licence inventory
        run: |
          mkdir -p audit-evidence
          node scripts/dependency-inventory.mjs audit-evidence/dependency-inventory.json
      - name: npm advisories
        run: npm audit --audit-level=low --json > audit-evidence/npm-audit.json
      - name: Rust licences, sources, bans and advisories
        shell: bash
        run: |
          set -o pipefail
          cargo deny --locked check 2>&1 | tee audit-evidence/cargo-deny.txt
      - name: GitHub Actions syntax and expression checks
        run: actionlint -shellcheck= -pyflakes=
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-evidence
          path: audit-evidence
          retention-days: 30
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: windows-x86
            runner: windows-latest
            target: i686-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Audio engine tests on Windows (WASAPI enumeration, RT checks)
        shell: bash
        run: |
          cargo test --locked --target ${{ matrix.target }} -p elyvon-audio -p elyvon-audio-device
          mkdir -p ci-audio
          cargo run --locked --target ${{ matrix.target }} -p elyvon-audio-device --example audio-probe -- --list | tee ci-audio/audio-devices.txt
      - name: Build installers (unsigned verification build)
        shell: bash
        env:
          # CI has no signing key: verify compilation and bundling only.
          TAURI_CONFIG_OVERRIDE: '{"bundle":{"createUpdaterArtifacts":false}}'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$TAURI_CONFIG_OVERRIDE"
      - name: Collect installers
        shell: bash
        env:
          UPDATER_ARTIFACTS: "0"
        run: |
          cargo build --release --locked -p elyvon-update --bin elyvon-release
          node scripts/collect-artifacts.mjs --target ${{ matrix.target }} --version "$(node -p "require('./package.json').version")" --out ci-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.label }}
          path: ci-artifacts
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-evidence-${{ matrix.label }}
          path: ci-audio
          retention-days: 30
          if-no-files-found: warn
