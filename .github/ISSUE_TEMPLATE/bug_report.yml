name: Bug report
description: Something in Elyvon Studio does not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings › About (for example 0.4.0) or the installer name.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - Windows x86
        - Other (not supported yet)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the demo session\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and audio setup
      description: Help › Open log folder, audio device and sample rate, and a project file if you can share one.
