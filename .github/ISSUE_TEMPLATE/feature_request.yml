name: Feature request
description: Suggest a capability or a workflow improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
  - type: textarea
    id: reference
    attributes:
      label: References
      description: How other DAWs handle it, screenshots or recordings.
