[workspace]
resolver = "3"
members = [
    "crates/elyvon-core",
    "crates/elyvon-project",
    "crates/elyvon-audio",
    "crates/elyvon-update",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Elyvon"]
publish = false
repository = "https://github.com/atorcam102/Elyvon"

[workspace.dependencies]
elyvon-core = { path = "crates/elyvon-core" }
elyvon-project = { path = "crates/elyvon-project" }
elyvon-audio = { path = "crates/elyvon-audio" }
elyvon-update = { path = "crates/elyvon-update" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
semver = { version = "1", features = ["serde"] }
log = "0.4"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = "debuginfo"
